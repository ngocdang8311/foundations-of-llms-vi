<div class="d3-shannon-approximations"></div>
<style>
  .d3-shannon-approximations { font-size: 14px; color: var(--text-color); }
  .d3-shannon-approximations .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; margin-bottom: 14px; }
  .d3-shannon-approximations .control-group { display: flex; flex-direction: column; gap: 6px; }
  .d3-shannon-approximations .control-label { font-size: 12px; font-weight: 700; }
  .d3-shannon-approximations .slider-row { display: flex; align-items: center; gap: 10px; }
  .d3-shannon-approximations input[type="range"] { width: 180px; accent-color: var(--primary-color); }
  .d3-shannon-approximations .n-value { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.5em; }
  .d3-shannon-approximations .btn { font: inherit; font-size: 12px; padding: 6px 11px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--surface-bg); color: var(--text-color); cursor: pointer; }
  .d3-shannon-approximations .btn:hover { border-color: var(--primary-color); }
  .d3-shannon-approximations .btn:focus-visible, .d3-shannon-approximations input:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 1px; }
  .d3-shannon-approximations .block { padding: 10px 0; border-top: 1px solid var(--border-color); }
  .d3-shannon-approximations .block-title { font-size: 12px; font-weight: 700; color: var(--muted-color); margin-bottom: 4px; }
  .d3-shannon-approximations .block-title .order { font-weight: 400; }
  .d3-shannon-approximations .ours { line-height: 1.55; }
  .d3-shannon-approximations .shannon { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; letter-spacing: 0.02em; overflow-wrap: anywhere; }
  .d3-shannon-approximations .absent { color: var(--muted-color); font-size: 13px; font-style: italic; }
</style>
<script>
  (() => {
    const bootstrap = () => {
      const scriptEl = document.currentScript;
      let container = scriptEl ? scriptEl.previousElementSibling : null;
      if (!(container && container.classList && container.classList.contains('d3-shannon-approximations'))) {
        const candidates = Array.from(document.querySelectorAll('.d3-shannon-approximations'))
          .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
        container = candidates[candidates.length - 1] || null;
      }
      if (!container) return;
      if (container.dataset.mounted === 'true') return;
      container.dataset.mounted = 'true';

      // Shannon (1948), section 3, "The Series of Approximations to English", quoted exactly.
      // n is the number of symbols in the n-gram: his "first-order approximation" draws each
      // symbol from its frequency (n = 1), the "second-order" one from the previous symbol (n = 2).
      const SHANNON_LETTERS = {
        1: { name: 'Xấp xỉ bậc một (các ký hiệu độc lập nhưng có tần suất của văn bản tiếng Anh)', text: 'OCRO HLI RGWR NMIELWIS EU LL NBNESEBYA TH EEI ALHENHTTPA OOBTTVA NAH BRL.' },
        2: { name: 'Xấp xỉ bậc hai (cấu trúc cặp ký tự digram như trong tiếng Anh)', text: 'ON IE ANTSOUTINYS ARE T INCTORE ST BE S DEAMY ACHIN D ILONASIVE TUCOOWE AT TEASONARE FUSO TIZIN ANDY TOBE SEACE CTISBE.' },
        3: { name: 'Xấp xỉ bậc ba (cấu trúc bộ ba ký tự trigram như trong tiếng Anh)', text: 'IN NO IST LAT WHEY CRATICT FROURE BIRS GROCID PONDENOME OF DEMONSTURES OF THE REPTAGIN IS REGOACTIONA OF CRE.' },
      };
      const SHANNON_WORDS = {
        1: { name: 'Xấp xỉ từ bậc một', text: 'REPRESENTING AND SPEEDILY IS AN GOOD APT OR COME CAN DIFFERENT NATURAL HERE HE THE A IN CAME THE TO OF TO EXPERT GRAY COME TO FURNISHES THE LINE MESSAGE HAD BE THESE.' },
        2: { name: 'Xấp xỉ từ bậc hai', text: 'THE HEAD AND IN FRONTAL ATTACK ON AN ENGLISH WRITER THAT THE CHARACTER OF THIS POINT IS THEREFORE ANOTHER METHOD FOR THE LETTERS THAT THE TIME OF WHO EVER TOLD THE PROBLEM FOR AN UNEXPECTED.' },
      };
      const STOPPED = 'Shannon đã dừng lại ở đây: “Sẽ rất thú vị nếu có thể xây dựng các xấp xỉ bậc cao hơn nữa, nhưng công sức cần bỏ ra ở bước tiếp theo trở nên khổng lồ.”';

      let mountEl = container;
      while (mountEl && !mountEl.getAttribute?.('data-datafiles')) mountEl = mountEl.parentElement;
      const attr = mountEl ? mountEl.getAttribute('data-datafiles') : null;
      const file = attr && attr.trim() ? attr.trim() : 'ngram-samples.json';
      const PATHS = file.includes('/') ? [file] : [`/data/${file}`, `./assets/data/${file}`, `../assets/data/${file}`];
      const fetchFirstAvailable = async (paths) => {
        for (const p of paths) {
          try { const r = await fetch(p, { cache: 'no-cache' }); if (r.ok) return await r.json(); } catch (_) {}
        }
        throw new Error(`Data not found: ${paths.join(', ')}`);
      };

      const uid = Math.random().toString(36).slice(2, 8);
      container.innerHTML = `
        <div class="controls">
          <div class="control-group">
            <label class="control-label" for="n-${uid}">n, độ dài của n-gram</label>
            <div class="slider-row">
              <input type="range" id="n-${uid}" min="1" max="5" step="1" value="1" />
              <span class="n-value"></span>
            </div>
          </div>
          <button type="button" class="btn next">Mẫu khác</button>
        </div>
        <div class="block"><div class="block-title">Mô hình của chúng ta, cấp độ từ, WikiText-2 <span class="order ours-order"></span></div><div class="ours"></div></div>
        <div class="block"><div class="block-title">Shannon (1948), cấp độ từ <span class="order words-order"></span></div><div class="words"></div></div>
        <div class="block"><div class="block-title">Shannon (1948), cấp độ chữ cái <span class="order letters-order"></span></div><div class="letters"></div></div>`;
      const slider = container.querySelector('input[type="range"]');
      const nValue = container.querySelector('.n-value');
      const ours = container.querySelector('.ours');
      const words = container.querySelector('.words');
      const letters = container.querySelector('.letters');
      const wordsOrder = container.querySelector('.words-order');
      const lettersOrder = container.querySelector('.letters-order');

      let samples = null;
      let index = 0;

      const fill = (el, orderEl, entry) => {
        if (entry) {
          el.className = el.className.split(' ')[0] + ' shannon';
          el.textContent = entry.text;
          orderEl.textContent = `· ${entry.name}`;
        } else {
          el.className = el.className.split(' ')[0] + ' absent';
          el.textContent = STOPPED;
          orderEl.textContent = '';
        }
      };

      function render() {
        const n = Number(slider.value);
        nValue.textContent = `n = ${n}`;
        ours.textContent = samples ? samples[n][index % samples[n].length] + ' …' : 'Đang tải…';
        fill(words, wordsOrder, SHANNON_WORDS[n]);
        fill(letters, lettersOrder, SHANNON_LETTERS[n]);
      }

      slider.addEventListener('input', render);
      container.querySelector('.next').addEventListener('click', () => { index += 1; render(); });
      render();
      fetchFirstAvailable(PATHS).then((raw) => { samples = raw.samples; render(); }).catch((err) => {
        ours.textContent = String(err.message || err);
        ours.style.color = 'var(--danger-color)';
      });
    };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap, { once: true });
    else bootstrap();
  })();
</script>
