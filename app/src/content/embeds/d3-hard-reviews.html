<div class="d3-hard-reviews"></div>
<style>
  .d3-hard-reviews { font-size: 13px; color: var(--text-color); }
  .d3-hard-reviews .scroll { overflow-x: auto; }
  /* The table rules start with ".scroll" to override the template's rules for the tables of the article. */
  .d3-hard-reviews .scroll table { width: 100%; border-collapse: collapse; margin: 0; background: none; }
  .d3-hard-reviews .scroll th, .d3-hard-reviews .scroll td { border: 0; border-top: 1px solid var(--border-color); padding: 6px 8px; font-size: 13px; white-space: normal; vertical-align: middle; text-align: left; background: none; }
  .d3-hard-reviews .scroll thead th { border-top: 0; padding-top: 0; vertical-align: bottom; font-size: 11.5px; font-weight: 700; color: var(--muted-color); line-height: 1.3; background: none; }
  .d3-hard-reviews .scroll thead th.model { text-align: center; min-width: 76px; max-width: 110px; }
  .d3-hard-reviews .scroll thead th .section { display: block; font-weight: 400; }
  .d3-hard-reviews .scroll thead th .section a { color: var(--muted-color); text-decoration: none; background: none; border-bottom: 0; }
  .d3-hard-reviews .scroll thead th .section a[href]:hover { text-decoration: underline; }
  .d3-hard-reviews .scroll td.review { min-width: 200px; line-height: 1.4; }
  .d3-hard-reviews .scroll td.label { white-space: nowrap; font-size: 12px; color: var(--muted-color); }
  .d3-hard-reviews .scroll td.label .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .d3-hard-reviews .scroll tr.kind td { padding: 12px 8px 3px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-color); }
  .d3-hard-reviews .scroll td.p { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; border-left: 2px solid var(--surface-bg, var(--page-bg)); }
  .d3-hard-reviews .scroll td.p.wrong { font-weight: 700; }
  .d3-hard-reviews .scroll td.p .mark { display: inline-block; width: 0.9em; margin-left: 2px; text-align: left; }
  .d3-hard-reviews .scroll tbody tr.review-row:hover td.review { background: color-mix(in oklab, var(--text-color) 5%, transparent); }
  .d3-hard-reviews .scroll tfoot td { font-weight: 700; border-top: 2px solid var(--border-color); }
  .d3-hard-reviews .legend { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 12px; }
  .d3-hard-reviews .legend-title { font-size: 12px; font-weight: 700; color: var(--text-color); }
  .d3-hard-reviews .legend .items { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .d3-hard-reviews .legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; }
  .d3-hard-reviews .legend .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border-color); }
  .d3-hard-reviews .error { color: var(--danger-color); white-space: pre-wrap; }
  @media (max-width: 560px) {
    .d3-hard-reviews .scroll td.review { min-width: 140px; font-size: 12px; }
    .d3-hard-reviews .scroll td.label .label-text { display: none; }
    .d3-hard-reviews .scroll th, .d3-hard-reviews .scroll td { padding: 5px 5px; }
    .d3-hard-reviews .scroll thead th.model { min-width: 62px; }
  }
</style>
<script>
  (() => {
    // The hard reviews of section 3.4, and the probability of being positive that each model of the
    // post gives them, from hard-reviews.json (written by the exercise notebooks). One row per review,
    // grouped by kind of difficulty, and one column per model. Each cell is colored toward the class
    // that the model predicts, more strongly when the model is more confident; a cross marks a wrong
    // answer. HtmlEmbed props: data = "hard-reviews.json"; config = { upTo: "5.5" } shows the models
    // that enter the post up to that section.
    const bootstrap = () => {
      const scriptEl = document.currentScript;
      let container = scriptEl ? scriptEl.previousElementSibling : null;
      if (container && container.tagName === 'STYLE') container = container.previousElementSibling;
      if (!(container && container.classList && container.classList.contains('d3-hard-reviews'))) {
        const candidates = Array.from(document.querySelectorAll('.d3-hard-reviews'))
          .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
        container = candidates[candidates.length - 1] || null;
      }
      if (!container) return;
      if (container.dataset.mounted === 'true') return;
      container.dataset.mounted = 'true';

      let mountEl = container;
      while (mountEl && !mountEl.getAttribute?.('data-datafiles') && !mountEl.getAttribute?.('data-config')) mountEl = mountEl.parentElement;
      const attr = mountEl ? mountEl.getAttribute('data-datafiles') : null;
      let config = {};
      try { const c = mountEl ? mountEl.getAttribute('data-config') : null; if (c && c.trim()) config = JSON.parse(c); } catch (_) {}
      const file = attr && attr.trim() ? attr.trim() : 'hard-reviews.json';
      const PATHS = file.includes('/') ? [file] : [`/data/${file}`, `./assets/data/${file}`, `../assets/data/${file}`];
      const fetchFirstAvailable = async (paths) => {
        for (const p of paths) {
          try { const r = await fetch(p, { cache: 'no-cache' }); if (r.ok) return await r.json(); } catch (_) {}
        }
        throw new Error(`Data not found: ${paths.join(', ')}`);
      };

      const parts = (s) => String(s).split('.').map(Number);
      const compare = (a, b) => {
        const pa = parts(a), pb = parts(b);
        for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
          const d = (pa[i] ?? -1) - (pb[i] ?? -1);
          if (d) return d;
        }
        return 0;
      };
      const upTo = config.upTo ? String(config.upTo) : null;

      // The heading of a section ("3.4" -> "3.4 The limit"), as in d3-scoreboard.html.
      const sectionHref = (s) => {
        const top = !s.includes('.');
        const pattern = new RegExp('^' + s.replace(/\./g, '\\.') + (top ? '\\.\\s' : '\\s'));
        const h = Array.from(document.querySelectorAll('main h2[id], main h3[id], main h4[id]'))
          .find((el) => (top ? el.tagName === 'H2' : el.tagName !== 'H2') && pattern.test((el.textContent || '').trim()));
        return h ? `#${h.id}` : null;
      };

      // The section 4.3 of the post names the deep averaging network "DAN": the headers use it.
      const shortLabel = (label) => label.replace(/^Deep averaging network/, 'DAN');
      const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

      // Diverging palette, as in banner.html: one end for negative, the other for positive.
      const colors = () => {
        let neg = 'var(--primary-color)';
        let pos = 'var(--info-color)';
        try {
          const div = window.ColorPalettes && window.ColorPalettes.getColors('diverging', 3);
          if (div && div.length >= 3) { neg = div[0]; pos = div[div.length - 1]; }
        } catch (_) {}
        return { neg, pos };
      };

      let data = null;

      function render() {
        if (!data) return;
        const { neg, pos } = colors();
        const models = data.models.filter((m) => !upTo || compare(m.section, upTo) <= 0);
        const tint = (p) => {
          const strength = Math.abs(2 * p - 1);   // 0 when p = 0.5, 1 when p = 0 or 1
          return `color-mix(in oklab, ${p >= 0.5 ? pos : neg} ${Math.round(6 + 40 * strength)}%, transparent)`;
        };

        container.innerHTML = '';
        const scroll = document.createElement('div');
        scroll.className = 'scroll';
        const table = document.createElement('table');

        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        headRow.innerHTML = '<th scope="col">Review</th><th scope="col">Label</th>';
        models.forEach((m) => {
          const th = document.createElement('th');
          th.className = 'model';
          th.scope = 'col';
          th.append(shortLabel(m.label));
          const section = document.createElement('span');
          section.className = 'section';
          const a = document.createElement('a');
          a.textContent = `section ${m.section}`;
          const href = sectionHref(String(m.section));
          if (href) a.href = href;
          section.appendChild(a);
          th.appendChild(section);
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        const right = models.map(() => 0);
        let kind = null;
        data.reviews.forEach((review, i) => {
          if (review.kind !== kind) {
            kind = review.kind;
            const tr = document.createElement('tr');
            tr.className = 'kind';
            const td = document.createElement('td');
            td.colSpan = 2 + models.length;
            td.textContent = capitalize(kind);
            tr.appendChild(td);
            tbody.appendChild(tr);
          }
          const tr = document.createElement('tr');
          tr.className = 'review-row';
          const text = document.createElement('td');
          text.className = 'review';
          text.textContent = `“${review.text}”`;
          const label = document.createElement('td');
          label.className = 'label';
          const positive = review.label === 'positive';
          label.innerHTML = `<span class="swatch" style="background:${positive ? pos : neg}"></span><span class="label-text">${review.label}</span>`;
          label.title = review.label;
          tr.append(text, label);
          models.forEach((m, j) => {
            const p = m.p_positive[i];
            const isRight = (p >= 0.5) === positive;
            if (isRight) right[j] += 1;
            const td = document.createElement('td');
            td.className = `p${isRight ? '' : ' wrong'}`;
            td.style.background = tint(p);
            td.title = `${m.label}: p(positive) = ${p.toFixed(4)}${isRight ? '' : ', wrong'}`;
            td.innerHTML = `${p.toFixed(3)}<span class="mark" aria-label="${isRight ? 'right' : 'wrong'}">${isRight ? '' : '✗'}</span>`;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        const tfoot = document.createElement('tfoot');
        const footRow = document.createElement('tr');
        footRow.innerHTML = '<td colspan="2">Right answers</td>';
        right.forEach((n) => {
          const td = document.createElement('td');
          td.className = 'p';
          td.textContent = `${n} / ${data.reviews.length}`;
          footRow.appendChild(td);
        });
        tfoot.appendChild(footRow);
        table.appendChild(tfoot);

        scroll.appendChild(table);
        container.appendChild(scroll);

        const legend = document.createElement('div');
        legend.className = 'legend';
        legend.innerHTML = `<div class="legend-title">Legend</div><div class="items">
          <span class="item"><span class="swatch" style="background:${tint(0)}"></span><span>predicted negative</span></span>
          <span class="item"><span class="swatch" style="background:${tint(1)}"></span><span>predicted positive</span></span>
          <span class="item"><span>✗ wrong answer</span></span>
          <span class="item"><span>the stronger the color, the more confident the model</span></span>
        </div>`;
        container.appendChild(legend);
      }

      fetchFirstAvailable(PATHS).then((d) => { data = d; render(); }).catch((err) => {
        const pre = document.createElement('pre'); pre.className = 'error'; pre.textContent = String(err.message || err);
        container.appendChild(pre);
      });
      document.addEventListener('palettes:updated', render);
    };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap, { once: true });
    else bootstrap();
  })();
</script>
