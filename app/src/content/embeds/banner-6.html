<div class="d3-banner-6"></div>
<style>
  .d3-banner-6 {
    padding: 20px 24px;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    background: color-mix(in oklab, var(--text-color) 4%, var(--page-bg));
    color: var(--text-color);
    font-size: 13px;
  }
  .d3-banner-6 .b6-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .d3-banner-6 .b6-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted-color);
  }
  .d3-banner-6 .b6-title {
    font-size: 16px;
    font-weight: 700;
    margin-top: 2px;
  }
  .d3-banner-6 .b6-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-bg);
    padding: 6px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
  }
  .d3-banner-6 .b6-controls label {
    font-weight: 600;
    white-space: nowrap;
  }
  .d3-banner-6 .b6-controls input[type="range"] {
    width: 150px;
    accent-color: var(--primary-color);
    cursor: pointer;
  }
  .d3-banner-6 .b6-ctx-badge {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--primary-color);
    min-width: 68px;
    text-align: right;
  }
  .d3-banner-6 .b6-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .d3-banner-6 .b6-card {
    border: 1px solid var(--border-color);
    border-radius: 9px;
    padding: 12px;
    background: var(--surface-bg);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .d3-banner-6 .b6-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .d3-banner-6 .b6-arch-name {
    font-weight: 700;
    font-size: 13.5px;
  }
  .d3-banner-6 .b6-tag {
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    background: color-mix(in oklab, var(--text-color) 8%, transparent);
    color: var(--muted-color);
  }
  .d3-banner-6 .b6-metric {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .d3-banner-6 .b6-metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--muted-color);
  }
  .d3-banner-6 .b6-metric-val {
    font-weight: 700;
    color: var(--text-color);
    font-variant-numeric: tabular-nums;
  }
  .d3-banner-6 .b6-bar-bg {
    height: 6px;
    border-radius: 3px;
    background: color-mix(in oklab, var(--text-color) 10%, transparent);
    overflow: hidden;
  }
  .d3-banner-6 .b6-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.2s ease;
  }
  .d3-banner-6 .b6-note {
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px dashed var(--border-color);
    font-size: 11px;
    line-height: 1.35;
    color: var(--muted-color);
  }
  @media (max-width: 820px) {
    .d3-banner-6 .b6-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 520px) {
    .d3-banner-6 .b6-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
<script>
  (() => {
    const STEPS = [1, 4, 16, 32, 64, 128, 256, 512]; // in K tokens

    const ARCHS = [
      {
        id: 'dense',
        name: 'Dense Transformer',
        sub: 'Llama-3 70B',
        totalParams: '70B',
        activeParams: '70B (100%)',
        // Prefill FLOPs in TFLOPs approx: 2 * N_active * L + 4 * n_layers * d * L^2
        computeFn: (k) => 2 * 70 * k + 0.013 * k * k,
        // KV / State memory in GB (FP16, GQA-8, 80 layers)
        stateFn: (k) => 0.32 * k,
        note: 'Mọi token đi qua toàn bộ 70B tham số; chi phí Attention tăng bậc hai O(L²).'
      },
      {
        id: 'moe',
        name: 'Sparse MoE',
        sub: 'Mixtral / DeepSeek-V3',
        totalParams: '47B (Top-2/8)',
        activeParams: '13B (28%)',
        computeFn: (k) => 2 * 13 * k + 0.006 * k * k,
        stateFn: (k) => 0.13 * k,
        note: 'Dung lượng tri thức 47B nhưng mỗi token chỉ kích hoạt 2 chuyên gia (13B FLOPs).'
      },
      {
        id: 'ssm',
        name: 'Mamba / Selective SSM',
        sub: 'Mamba-2 (Tuyến tính)',
        totalParams: '13B',
        activeParams: '13B (O(L))',
        computeFn: (k) => 2 * 13 * k,
        stateFn: () => 0.08, // Hằng số O(1) theo L!
        note: 'Không có KV Cache! Nén lịch sử vào trạng thái cố định S_t, suy luận O(1) bộ nhớ.'
      },
      {
        id: 'hybrid',
        name: 'Hybrid Jamba',
        sub: '7 Mamba : 1 Attention + MoE',
        totalParams: '52B',
        activeParams: '12B (Hybrid)',
        computeFn: (k) => 2 * 12 * k + 0.0008 * k * k,
        stateFn: (k) => 0.07 + 0.016 * k,
        note: 'Giảm 87% KV Cache nhờ chỉ giữ 1 lớp Attention trên mỗi 8 lớp, bảo toàn khả năng sao chép.'
      }
    ];

    const bootstrap = () => {
      const scriptEl = document.currentScript;
      let container = scriptEl ? scriptEl.previousElementSibling : null;
      if (container && container.tagName === 'STYLE') container = container.previousElementSibling;
      if (!(container && container.classList && container.classList.contains('d3-banner-6'))) {
        const candidates = Array.from(document.querySelectorAll('.d3-banner-6'))
          .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
        container = candidates[candidates.length - 1] || null;
      }
      if (!container || container.dataset.mounted === 'true') return;
      container.dataset.mounted = 'true';

      let colors = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759'];
      const updatePalette = () => {
        try {
          if (window.ColorPalettes) {
            const cat = window.ColorPalettes.getColors('categorical', 4);
            if (cat && cat.length >= 4) colors = cat;
          }
        } catch (_) {}
      };
      updatePalette();

      const header = document.createElement('div');
      header.className = 'b6-header';
      header.innerHTML = `
        <div>
          <div class="b6-kicker">Chương 6 · So sánh Độ phức tạp theo Chiều dài Chuỗi</div>
          <div class="b6-title">Chi phí Tiền xử lý (Prefill FLOPs) & Bộ nhớ Trạng thái (KV / SSM State)</div>
        </div>
        <div class="b6-controls">
          <label for="b6-slider">Ngữ cảnh $L$:</label>
          <input id="b6-slider" type="range" min="0" max="${STEPS.length - 1}" value="4" step="1" />
          <span class="b6-ctx-badge" id="b6-ctx-val">64K tokens</span>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = 'b6-grid';

      const cards = ARCHS.map((arch, idx) => {
        const card = document.createElement('div');
        card.className = 'b6-card';
        card.innerHTML = `
          <div class="b6-card-head">
            <span class="b6-arch-name">${arch.name}</span>
            <span class="b6-tag">${arch.sub}</span>
          </div>
          <div class="b6-metric">
            <div class="b6-metric-row">
              <span>Tham số kích hoạt</span>
              <span class="b6-metric-val">${arch.activeParams} / ${arch.totalParams}</span>
            </div>
          </div>
          <div class="b6-metric">
            <div class="b6-metric-row">
              <span>Tính toán (Prefill)</span>
              <span class="b6-metric-val" data-role="compute"></span>
            </div>
            <div class="b6-bar-bg"><div class="b6-bar-fill" data-role="compute-bar"></div></div>
          </div>
          <div class="b6-metric">
            <div class="b6-metric-row">
              <span>Bộ nhớ trạng thái</span>
              <span class="b6-metric-val" data-role="state"></span>
            </div>
            <div class="b6-bar-bg"><div class="b6-bar-fill" data-role="state-bar"></div></div>
          </div>
          <div class="b6-note">${arch.note}</div>
        `;
        grid.appendChild(card);
        return { arch, card, idx };
      });

      container.append(header, grid);

      const slider = header.querySelector('#b6-slider');
      const ctxVal = header.querySelector('#b6-ctx-val');

      const fmtFlops = (tf) => tf >= 1000 ? `${(tf / 1000).toFixed(1)} PFLOPs` : `${Math.round(tf)} TFLOPs`;
      const fmtMem = (gb) => gb < 1 ? `${Math.round(gb * 1024)} MB` : `${gb.toFixed(1)} GB`;

      const render = () => {
        updatePalette();
        const stepIdx = parseInt(slider.value, 10);
        const k = STEPS[stepIdx];
        ctxVal.textContent = `${k}K tokens`;

        const maxCompute = ARCHS[0].computeFn(k);
        const maxState = Math.max(ARCHS[0].stateFn(k), 1);

        cards.forEach(({ arch, card, idx }) => {
          const c = arch.computeFn(k);
          const s = arch.stateFn(k);
          const col = colors[idx % colors.length];
          card.style.borderTop = `3px solid ${col}`;

          card.querySelector('[data-role="compute"]').textContent = fmtFlops(c);
          const cBar = card.querySelector('[data-role="compute-bar"]');
          cBar.style.width = `${Math.min(100, Math.max(4, (c / maxCompute) * 100))}%`;
          cBar.style.background = col;

          card.querySelector('[data-role="state"]').textContent = fmtMem(s);
          const sBar = card.querySelector('[data-role="state-bar"]');
          sBar.style.width = `${Math.min(100, Math.max(3, (s / maxState) * 100))}%`;
          sBar.style.background = col;
        });
      };

      slider.addEventListener('input', render);
      document.addEventListener('palettes:updated', render);
      render();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap, { once: true });
    } else {
      bootstrap();
    }
  })();
</script>
