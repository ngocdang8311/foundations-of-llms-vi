<div class="d3-transfer"></div>
<style>
  .d3-transfer { font-size: 12px; color: var(--text-color); }
  .d3-transfer svg { display: block; width: 100%; height: auto; max-width: 660px; margin: 0 auto; overflow: visible; }
  .d3-transfer .token rect { fill: color-mix(in oklab, var(--text-color) 5%, transparent); stroke: var(--border-color); }
  .d3-transfer .token text { fill: var(--text-color); font-size: 12px; }
  .d3-transfer .box text { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: var(--text-color); }
  .d3-transfer .box text.box-sub { font-weight: 400; letter-spacing: 0; }
  .d3-transfer .box rect { transition: fill 0.25s ease, stroke 0.25s ease; }
  .d3-transfer .cell { stroke: var(--border-color); stroke-width: 0.5; transition: fill 0.3s ease; }
  .d3-transfer .arrow { stroke: var(--muted-color); fill: none; }
  .d3-transfer .copy { stroke: var(--muted-color); fill: none; stroke-dasharray: 5 4; transition: opacity 0.25s ease; }
  .d3-transfer .panel { fill: none; stroke: var(--border-color); stroke-dasharray: 3 3; }
  .d3-transfer .panel-title { fill: var(--text-color); font-size: 12px; font-weight: 700; }
  .d3-transfer .side { fill: var(--muted-color); font-size: 11px; }
  .d3-transfer .status { font-size: 11px; font-weight: 700; }
  .d3-transfer .out-label { fill: var(--text-color); font-size: 12px; }
  .d3-transfer .faded { transition: opacity 0.25s ease; }
  .d3-transfer .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; margin-bottom: 12px; }
  .d3-transfer .controls .control-label { font-size: 12px; font-weight: 700; }
  .d3-transfer .controls button { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--border-color); border-radius: 999px; background: var(--surface-bg); color: var(--text-color); cursor: pointer; }
  .d3-transfer .controls button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 16%, transparent); font-weight: 700; }
  .d3-transfer .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
<script>
  (() => {
    // Transfer learning with pre-trained embeddings: the embedding matrix W of the deep averaging
    // network of section 4.3 is either learned from scratch on the labeled reviews, or copied from
    // embeddings pre-trained on raw text and then kept fixed (frozen) or trained further
    // (fine-tuned). The values of the matrices are made up.
    const ensureD3 = (cb) => {
      if (window.d3 && typeof window.d3.select === 'function') return cb();
      let s = document.getElementById('d3-cdn-script');
      if (!s) { s = document.createElement('script'); s.id = 'd3-cdn-script'; s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js'; document.head.appendChild(s); }
      const onReady = () => { if (window.d3 && typeof window.d3.select === 'function') cb(); };
      s.addEventListener('load', onReady, { once: true });
      if (window.d3) onReady();
    };

    const bootstrap = () => {
      const scriptEl = document.currentScript;
      let container = scriptEl ? scriptEl.previousElementSibling : null;
      if (container && container.tagName === 'STYLE') container = container.previousElementSibling;
      if (!(container && container.classList && container.classList.contains('d3-transfer'))) {
        const candidates = Array.from(document.querySelectorAll('.d3-transfer'))
          .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
        container = candidates[candidates.length - 1] || null;
      }
      if (!container) return;
      if (container.dataset.mounted === 'true') return;
      container.dataset.mounted = 'true';

      const MODES = [
        { key: 'scratch', button: 'From scratch (section 4.3)', copied: false, trainW: true,
          wNote: 'random at the start' },
        { key: 'frozen', button: 'Pre-trained, frozen', copied: true, trainW: false,
          wNote: 'copied, kept fixed' },
        { key: 'finetuned', button: 'Pre-trained, fine-tuned', copied: true, trainW: true,
          wNote: 'copied, trained further' },
      ];
      let mode = MODES[1];

      let NEG = 'var(--primary-color)';
      let POS = 'var(--info-color)';
      let MODEL = '#4e79a7';
      let OUT = '#f28e2b';
      const readColors = () => {
        try {
          if (window.ColorPalettes) {
            const div = window.ColorPalettes.getColors('diverging', 3);
            if (div && div.length >= 3) { NEG = div[0]; POS = div[div.length - 1]; }
            const cat = window.ColorPalettes.getColors('categorical', 2);
            if (cat && cat.length >= 2) { MODEL = cat[0]; OUT = cat[1]; }
          }
        } catch (_) {}
        container.style.setProperty('--accent', MODEL);
      };
      readColors();
      const fill = (v) => `color-mix(in oklab, ${v >= 0 ? POS : NEG} ${Math.round(8 + 70 * Math.min(1, Math.abs(v)))}%, transparent)`;

      // A small embedding matrix: D rows, one column per word. The pre-trained values are made up
      // with some structure; the random ones are small and without structure.
      const COLS = 12, ROWS = 5;
      const PRETRAINED = d3.range(ROWS).map((r) => d3.range(COLS).map((c) => 0.9 * Math.sin(0.8 * c * (r + 1) + 1.3 * r)));
      const RANDOM = d3.range(ROWS).map((r) => d3.range(COLS).map((c) => 0.25 * Math.sin(12.9898 * (c + 1) * (r + 3) + 78.233)));
      const TUNED = PRETRAINED.map((row, r) => row.map((v, c) => v + 0.3 * Math.sin(3.1 * (c + 2) * (r + 1))));

      const W = 660, H = 410;
      const leftX = 12, leftW = 206;
      const panelTop = 16;
      const rightX = 250, rightW = 398;
      const rightCx = 400;
      const cellW = 12, cellH = 12;
      const matW = COLS * cellW, matH = ROWS * cellH;

      const uid = Math.random().toString(36).slice(2, 8);
      const markerId = `transfer-arrow-${uid}`;
      const svg = d3.select(container).append('svg').attr('viewBox', `0 0 ${W} ${H}`)
        .attr('role', 'img')
        .attr('aria-label', 'The embedding matrix of a review classifier is learned from scratch, or copied from embeddings pre-trained on raw text, then kept fixed or trained further.');
      svg.append('defs').append('marker').attr('id', markerId).attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
        .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto-start-reverse')
        .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--muted-color)');
      const g = svg.append('g');
      const arrow = (parent, x1, y1, x2, y2) => parent.append('path').attr('class', 'arrow').attr('stroke-width', 1.2)
        .attr('d', `M${x1},${y1} L${x2},${y2}`).attr('marker-end', `url(#${markerId})`);
      const matrix = (parent, x0, y0) => {
        const m = parent.append('g');
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            m.append('rect').attr('class', 'cell').attr('x', x0 + c * cellW).attr('y', y0 + r * cellH)
              .attr('width', cellW).attr('height', cellH).datum([r, c]);
          }
        }
        return m;
      };

      // Left panel: pre-training on raw text
      const left = g.append('g').attr('class', 'faded');
      const leftCx = leftX + leftW / 2;
      left.append('rect').attr('class', 'panel').attr('x', leftX).attr('y', panelTop).attr('width', leftW).attr('height', 300).attr('rx', 10);
      left.append('text').attr('class', 'panel-title').attr('x', leftCx).attr('y', panelTop + 24).attr('text-anchor', 'middle').text('1. Pre-training');
      left.append('text').attr('class', 'side').attr('x', leftCx).attr('y', panelTop + 42).attr('text-anchor', 'middle').text('on raw text, without labels');
      const preMatX = leftX + (leftW - matW) / 2, preMatY = 150;
      left.append('text').attr('class', 'side').attr('x', leftCx).attr('y', preMatY - 10).attr('text-anchor', 'middle').text('embedding matrix W');
      const preMatrix = matrix(left, preMatX, preMatY);
      const preBox = left.append('g').attr('class', 'box');
      const preBoxY = 240;
      preBox.append('rect').attr('x', leftX + 22).attr('y', preBoxY).attr('width', leftW - 44).attr('height', 50).attr('rx', 7).attr('stroke-width', 1.3);
      preBox.append('text').attr('x', leftCx).attr('y', preBoxY + 21).attr('text-anchor', 'middle').text('WORD2VEC, GLOVE');
      preBox.append('text').attr('class', 'box-sub').attr('x', leftCx).attr('y', preBoxY + 38).attr('text-anchor', 'middle').text('billions of words');
      arrow(left, leftCx, preBoxY - 3, leftCx, preMatY + matH + 6);

      // Right panel: the classifier of the reviews, from the review (bottom) to its label (top)
      g.append('rect').attr('class', 'panel').attr('x', rightX).attr('y', panelTop).attr('width', rightW).attr('height', H - panelTop - 6).attr('rx', 10);
      g.append('text').attr('class', 'panel-title').attr('x', rightX + rightW / 2).attr('y', panelTop + 24).attr('text-anchor', 'middle').text('2. Downstream task');
      g.append('text').attr('class', 'side').attr('x', rightX + rightW / 2).attr('y', panelTop + 42).attr('text-anchor', 'middle').text('classify the reviews, with labels');

      // The review
      const WORDS = ['A', 'superb', 'film', ',', 'wonderful', 'score'];
      const tokenY = 362, tokenH = 24;
      const tokenWidth = (w) => Math.max(22, w.length * 7 + 12);
      const rowW = d3.sum(WORDS, tokenWidth) + 6 * (WORDS.length - 1);
      let x = rightCx - rowW / 2;
      WORDS.forEach((w) => {
        const width = tokenWidth(w);
        const t = g.append('g').attr('class', 'token');
        t.append('rect').attr('x', x).attr('y', tokenY).attr('width', width).attr('height', tokenH).attr('rx', 4);
        t.append('text').attr('x', x + width / 2).attr('y', tokenY + tokenH / 2).attr('dy', '0.35em').attr('text-anchor', 'middle').text(w);
        x += width + 6;
      });

      // W, then the average, the hidden layers and the head
      const dsMatX = rightCx - matW / 2, dsMatY = 282;
      arrow(g, rightCx, tokenY - 3, rightCx, dsMatY + matH + 5);
      const dsMatrix = matrix(g, dsMatX, dsMatY);
      const statusX = rightCx + 92;
      const wStatus = g.append('text').attr('class', 'status').attr('x', statusX).attr('y', dsMatY + matH / 2 - 4);
      const wNote = g.append('text').attr('class', 'side').attr('x', statusX).attr('y', dsMatY + matH / 2 + 10);
      g.append('text').attr('class', 'side').attr('x', dsMatX - 10).attr('y', dsMatY + matH / 2).attr('dy', '0.35em').attr('text-anchor', 'end').text('W');

      const boxW = 160, boxH = 30;
      const stack = [
        { y: 234, label: 'AVERAGE', trained: null },
        { y: 182, label: 'HIDDEN LAYERS', trained: true },
        { y: 130, label: 'HEAD', trained: true },
      ];
      arrow(g, rightCx, dsMatY - 3, rightCx, stack[0].y + boxH + 3);
      const boxes = stack.map((st, k) => {
        const b = g.append('g').attr('class', 'box');
        b.append('rect').attr('x', rightCx - boxW / 2).attr('y', st.y).attr('width', boxW).attr('height', boxH).attr('rx', 7).attr('stroke-width', 1.3);
        b.append('text').attr('x', rightCx).attr('y', st.y + boxH / 2).attr('dy', '0.35em').attr('text-anchor', 'middle').text(st.label);
        const status = g.append('text').attr('class', 'status').attr('x', statusX).attr('y', st.y + boxH / 2).attr('dy', '0.35em');
        if (k > 0) arrow(g, rightCx, stack[k - 1].y - 3, rightCx, st.y + boxH + 3);
        return { b, status, st };
      });
      arrow(g, rightCx, stack[2].y - 3, rightCx, 110);

      // The output
      const OUTPUTS = [['positive', 0.9], ['negative', 0.1]];
      OUTPUTS.forEach(([label, v], i) => {
        const y = 76 + i * 14;
        g.append('text').attr('class', 'out-label').attr('x', rightCx - 8).attr('y', y + 6).attr('dy', '0.35em').attr('text-anchor', 'end').text(label);
        g.append('rect').attr('class', 'out-bar').attr('x', rightCx).attr('y', y + 2).attr('width', 70 * v).attr('height', 8).attr('rx', 2).attr('opacity', 0.85);
      });

      // The copy of W, from the left panel to the right one
      const copyLine = g.append('path').attr('class', 'copy').attr('stroke-width', 1.3)
        .attr('d', `M${preMatX + matW + 6},${preMatY + matH / 2} C 250,${preMatY + matH / 2} 250,${dsMatY + matH / 2} ${dsMatX - 24},${dsMatY + matH / 2}`)
        .attr('marker-end', `url(#${markerId})`);
      const copyLabel = g.append('text').attr('class', 'side').attr('x', 236).attr('y', (preMatY + dsMatY + matH) / 2 + 6).attr('text-anchor', 'middle').text('copy');

      // The toggle, above the figure
      const controls = document.createElement('div');
      controls.className = 'controls';
      controls.innerHTML = `<span class="control-label" id="transfer-label-${uid}">Embeddings</span>`;
      controls.setAttribute('role', 'group');
      controls.setAttribute('aria-labelledby', `transfer-label-${uid}`);
      MODES.forEach((m) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = m.button;
        b.addEventListener('click', () => { mode = m; render(); });
        controls.appendChild(b);
      });
      container.insertBefore(controls, container.firstChild);

      const setStatus = (el, trained) => {
        if (trained === null) el.attr('fill', 'var(--muted-color)').text('no parameters');
        else if (trained) el.attr('fill', MODEL).text('trained');
        else el.attr('fill', 'var(--muted-color)').text('fixed');
      };

      function render() {
        controls.querySelectorAll('button').forEach((b, k) => b.setAttribute('aria-pressed', String(MODES[k] === mode)));
        left.style('opacity', mode.copied ? 1 : 0.35);
        copyLine.style('opacity', mode.copied ? 1 : 0);
        copyLabel.style('opacity', mode.copied ? 1 : 0);
        preBox.select('rect').attr('fill', `color-mix(in oklab, ${MODEL} 16%, transparent)`).attr('stroke', MODEL);
        preMatrix.selectAll('rect').attr('fill', ([r, c]) => fill(PRETRAINED[r][c]));
        const values = !mode.copied ? RANDOM : mode.trainW ? TUNED : PRETRAINED;
        dsMatrix.selectAll('rect').attr('fill', ([r, c]) => fill(values[r][c]))
          .attr('stroke', mode.trainW ? MODEL : 'var(--border-color)');
        setStatus(wStatus, mode.trainW);
        wNote.text(mode.wNote);
        boxes.forEach(({ b, status, st }) => {
          const trained = st.trained;
          b.select('rect')
            .attr('fill', trained ? `color-mix(in oklab, ${MODEL} 16%, transparent)` : 'color-mix(in oklab, var(--text-color) 4%, transparent)')
            .attr('stroke', trained ? MODEL : 'var(--border-color)');
          setStatus(status, trained);
        });
        g.selectAll('.out-bar').attr('fill', OUT);
      }

      render();
      document.addEventListener('palettes:updated', () => { readColors(); render(); });
    };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => ensureD3(bootstrap), { once: true });
    else ensureD3(bootstrap);
  })();
</script>
