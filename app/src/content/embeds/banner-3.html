<div class="d3-banner-3"></div>
<style>
  .d3-banner-3 {
    padding: 20px 24px;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    background: color-mix(in oklab, var(--text-color) 4%, var(--page-bg));
    color: var(--text-color);
    font-size: 13px;
  }
  .d3-banner-3 .b3-kicker {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted-color);
    text-align: center;
  }
  .d3-banner-3 .b3-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 12px 0 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--surface-bg);
    border: 1px solid var(--border-color);
  }
  .d3-banner-3 .b3-slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .d3-banner-3 .b3-slider-label {
    font-weight: 700;
    font-size: 13px;
    min-width: 170px;
  }
  .d3-banner-3 input[type="range"] {
    flex: 1 1 220px;
    accent-color: var(--primary-color);
    cursor: pointer;
  }
  .d3-banner-3 .b3-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .d3-banner-3 .b3-presets-label {
    font-size: 11.5px;
    color: var(--muted-color);
    margin-right: 4px;
  }
  .d3-banner-3 .b3-preset-btn {
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: var(--page-bg);
    color: var(--text-color);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .d3-banner-3 .b3-preset-btn:hover,
  .d3-banner-3 .b3-preset-btn.active {
    border-color: var(--primary-color);
    background: color-mix(in oklab, var(--primary-color) 15%, var(--surface-bg));
  }
  .d3-banner-3 .b3-cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .d3-banner-3 .b3-card {
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface-bg);
    border: 1px solid var(--border-color);
    text-align: center;
  }
  .d3-banner-3 .b3-card-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-color);
    margin-bottom: 4px;
  }
  .d3-banner-3 .b3-card-val {
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .d3-banner-3 .b3-card-sub {
    font-size: 11px;
    color: var(--muted-color);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .d3-banner-3 .b3-verdict {
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    background: color-mix(in oklab, var(--primary-color) 8%, var(--surface-bg));
    font-size: 12.5px;
    line-height: 1.45;
    text-align: center;
  }
  .d3-banner-3 svg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 720px;
    margin: 0 auto;
    overflow: visible;
  }
  @media (max-width: 640px) {
    .d3-banner-3 { padding: 14px 14px; }
    .d3-banner-3 .b3-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
<script>
  (() => {
    const ensureD3 = (cb) => {
      if (window.d3 && typeof window.d3.select === 'function') return cb();
      let s = document.getElementById('d3-cdn-script');
      if (!s) {
        s = document.createElement('script');
        s.id = 'd3-cdn-script';
        s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
        document.head.appendChild(s);
      }
      const onReady = () => { if (window.d3 && typeof window.d3.select === 'function') cb(); };
      s.addEventListener('load', onReady, { once: true });
      if (window.d3) onReady();
    };

    const bootstrap = () => {
      const scriptEl = document.currentScript;
      let container = scriptEl ? scriptEl.previousElementSibling : null;
      if (container && container.tagName === 'STYLE') container = container.previousElementSibling;
      if (!(container && container.classList && container.classList.contains('d3-banner-3'))) {
        const candidates = Array.from(document.querySelectorAll('.d3-banner-3'))
          .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
        container = candidates[candidates.length - 1] || null;
      }
      if (!container) return;
      if (container.dataset.mounted === 'true') return;
      container.dataset.mounted = 'true';

      const PRESETS = [
        { id: 'gpt2', label: 'GPT-2 XL (2019)', logC: 20.56, N_act: 1.5e9, D_act: 40e9, note: 'GPT-2 XL (1.5B tham số, 40B token): tỷ lệ D/N ≈ 26.7, khá gần tỷ lệ tối ưu Chinchilla 20:1 ở quy mô nhỏ.' },
        { id: 'gpt3', label: 'GPT-3 175B (2020)', logC: 23.50, N_act: 175e9, D_act: 300e9, note: 'GPT-3 (175B tham số, 300B token): tỷ lệ D/N chỉ ≈ 1.7! Mô hình quá lớn nhưng thiếu dữ liệu trầm trọng so với cấu hình tối ưu Chinchilla (51B tham số, 1.03T token).' },
        { id: 'chinchilla', label: 'Chinchilla 70B (2022)', logC: 23.76, N_act: 70e9, D_act: 1.4e12, note: 'Chinchilla (70B tham số, 1.4T token): tuân thủ đúng quy tắc vàng D ≈ 20N, đánh bại Gopher (280B tham số, 300B token) dù dùng cùng ngân sách tính toán!' },
        { id: 'llama3_8b', label: 'Llama-3 8B (2024)', logC: 23.86, N_act: 8e9, D_act: 15e12, note: 'Llama-3 8B (8B tham số, 15T token): cố tình huấn luyện vượt ngưỡng (over-train D/N ≈ 1875) để tạo ra mô hình nhỏ gọn, giảm mạnh chi phí suy luận khi triển khai thực tế.' },
        { id: 'llama3_405b', label: 'Llama-3 405B (2024)', logC: 25.58, N_act: 405e9, D_act: 15.6e12, note: 'Llama-3 405B (405B tham số, 15.6T token): ở quy mô 3.8×10²⁵ FLOPs, tỷ lệ D/N ≈ 38.5 nằm rất gần vùng tối ưu tính toán Chinchilla.' }
      ];

      // Chinchilla parametric loss L(N, D) = E + A / N^alpha + B / D^beta
      const E = 1.693, A = 406.4, B = 410.7, ALPHA = 0.34, BETA = 0.28;
      const calcLoss = (N, D) => E + A * Math.pow(N, -ALPHA) + B * Math.pow(D, -BETA);
      // Compute-optimal 20 tokens per parameter rule: C = 6 * N * D and D = 20 * N => N_opt = sqrt(C / 120)
      const calcOpt = (C) => {
        const N_opt = Math.sqrt(C / 120);
        const D_opt = 20 * N_opt;
        const L_opt = calcLoss(N_opt, D_opt);
        return { N_opt, D_opt, L_opt };
      };

      const fmtNum = (x, unit = '') => {
        if (x >= 1e12) return `${(x / 1e12).toFixed(2)}T${unit}`;
        if (x >= 1e9) return `${(x / 1e9).toFixed(1)}B${unit}`;
        if (x >= 1e6) return `${(x / 1e6).toFixed(0)}M${unit}`;
        return `${x.toFixed(0)}${unit}`;
      };
      const fmtSci = (log10Val) => {
        const exp = Math.floor(log10Val);
        const mant = Math.pow(10, log10Val - exp);
        const sup = String(exp).split('').map((c) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c] || c).join('');
        return `${mant.toFixed(2)} × 10${sup}`;
      };

      let currentLogC = 23.76;
      let activePreset = PRESETS[2];

      const kicker = document.createElement('p');
      kicker.className = 'b3-kicker';
      kicker.textContent = 'Máy tính tương tác Định luật Mở rộng Chinchilla (C ≈ 6ND · D_opt ≈ 20N_opt)';
      container.appendChild(kicker);

      const controls = document.createElement('div');
      controls.className = 'b3-controls';
      const sliderRow = document.createElement('div');
      sliderRow.className = 'b3-slider-row';
      const sliderLabel = document.createElement('span');
      sliderLabel.className = 'b3-slider-label';
      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = '18.0';
      slider.max = '25.6';
      slider.step = '0.02';
      slider.value = String(currentLogC);
      slider.setAttribute('aria-label', 'Ngân sách tính toán FLOPs');
      sliderRow.append(sliderLabel, slider);

      const presetsRow = document.createElement('div');
      presetsRow.className = 'b3-presets';
      const presetsLbl = document.createElement('span');
      presetsLbl.className = 'b3-presets-label';
      presetsLbl.textContent = 'Các mốc lịch sử:';
      presetsRow.appendChild(presetsLbl);

      const presetBtns = PRESETS.map((p) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'b3-preset-btn' + (p.id === activePreset.id ? ' active' : '');
        btn.textContent = p.label;
        btn.addEventListener('click', () => {
          activePreset = p;
          currentLogC = p.logC;
          slider.value = String(currentLogC);
          presetBtns.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          render();
        });
        presetsRow.appendChild(btn);
        return btn;
      });

      controls.append(sliderRow, presetsRow);
      container.appendChild(controls);

      const cardsGrid = document.createElement('div');
      cardsGrid.className = 'b3-cards';
      const makeCard = (title) => {
        const c = document.createElement('div');
        c.className = 'b3-card';
        const l = document.createElement('div');
        l.className = 'b3-card-label';
        l.textContent = title;
        const v = document.createElement('div');
        v.className = 'b3-card-val';
        const s = document.createElement('div');
        s.className = 'b3-card-sub';
        c.append(l, v, s);
        cardsGrid.appendChild(c);
        return { v, s };
      };
      const cardC = makeCard('Ngân sách C (FLOPs)');
      const cardN = makeCard('Tham số tối ưu N_opt');
      const cardD = makeCard('Lượng token D_opt');
      const cardL = makeCard('Loss kỳ vọng L(N*, D*)');
      container.appendChild(cardsGrid);

      // SVG chart showing trajectory of N_opt and D_opt across C from 10^18 to 10^25.6
      const W = 720, H = 185;
      const margin = { top: 20, right: 28, bottom: 32, left: 56 };
      const iW = W - margin.left - margin.right;
      const iH = H - margin.top - margin.bottom;

      const svg = d3.select(container).append('svg')
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('role', 'img')
        .attr('aria-label', 'Biểu đồ quỹ đạo mở rộng Chinchilla theo ngân sách FLOPs');
      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      const xScale = d3.scaleLinear().domain([18, 25.6]).range([0, iW]);
      const yScale = d3.scaleLinear().domain([7.5, 13.5]).range([iH, 0]); // log10(count) from 30M to 30T

      const xAxisG = g.append('g').attr('transform', `translate(0,${iH})`);
      const yAxisG = g.append('g');

      xAxisG.call(
        d3.axisBottom(xScale)
          .tickValues([18, 19, 20, 21, 22, 23, 24, 25])
          .tickFormat((d) => `10^${d}`)
      );
      yAxisG.call(
        d3.axisLeft(yScale)
          .tickValues([8, 9, 10, 11, 12, 13])
          .tickFormat((d) => ({ 8: '100M', 9: '1B', 10: '10B', 11: '100B', 12: '1T', 13: '10T' }[d] || `10^${d}`))
      );
      svg.selectAll('.domain, .tick line').attr('stroke', 'var(--border-color)');
      svg.selectAll('.tick text').attr('fill', 'var(--muted-color)').attr('font-size', '10.5px');

      g.append('text')
        .attr('x', iW / 2)
        .attr('y', iH + 28)
        .attr('text-anchor', 'middle')
        .attr('fill', 'var(--muted-color)')
        .attr('font-size', '11px')
        .text('Ngân sách tính toán C (FLOPs, thang log)');

      const cGrid = d3.range(18, 25.61, 0.1);
      const lineN = d3.line()
        .x((lc) => xScale(lc))
        .y((lc) => yScale(Math.log10(calcOpt(Math.pow(10, lc)).N_opt)));
      const lineD = d3.line()
        .x((lc) => xScale(lc))
        .y((lc) => yScale(Math.log10(calcOpt(Math.pow(10, lc)).D_opt)));

      const pathD = g.append('path').datum(cGrid).attr('fill', 'none').attr('stroke-width', 2.4);
      const pathN = g.append('path').datum(cGrid).attr('fill', 'none').attr('stroke-width', 2.4);

      // Preset markers on the chart
      const presetGroup = g.append('g');
      PRESETS.forEach((p) => {
        const pg = presetGroup.append('g').attr('transform', `translate(${xScale(p.logC)},0)`);
        pg.append('line')
          .attr('y1', 0).attr('y2', iH)
          .attr('stroke', 'var(--border-color)')
          .attr('stroke-dasharray', '2,2');
        pg.append('circle')
          .attr('class', 'preset-n')
          .attr('cy', yScale(Math.log10(p.N_act)))
          .attr('r', 4);
        pg.append('text')
          .attr('y', -5)
          .attr('text-anchor', 'middle')
          .attr('font-size', '10px')
          .attr('fill', 'var(--muted-color)')
          .text(p.label.split(' ')[0]);
      });

      const cursorLine = g.append('line').attr('y1', 0).attr('y2', iH).attr('stroke-width', 1.6).attr('stroke-dasharray', '4,3');
      const dotD = g.append('circle').attr('r', 5.5).attr('stroke', 'var(--page-bg)').attr('stroke-width', 1.5);
      const dotN = g.append('circle').attr('r', 5.5).attr('stroke', 'var(--page-bg)').attr('stroke-width', 1.5);

      const leg = g.append('g').attr('transform', `translate(12, 8)`);
      const legD = leg.append('g');
      const legDRect = legD.append('rect').attr('width', 12).attr('height', 3).attr('y', -4).attr('rx', 1.5);
      legD.append('text').attr('x', 18).attr('font-size', '11px').attr('fill', 'var(--text-color)').text('Token tối ưu D_opt (≈ 20 N_opt)');
      const legN = leg.append('g').attr('transform', 'translate(0, 16)');
      const legNRect = legN.append('rect').attr('width', 12).attr('height', 3).attr('y', -4).attr('rx', 1.5);
      legN.append('text').attr('x', 18).attr('font-size', '11px').attr('fill', 'var(--text-color)').text('Tham số tối ưu N_opt (điểm tròn mờ = N thực tế của các mô hình)');

      const verdict = document.createElement('div');
      verdict.className = 'b3-verdict';
      container.appendChild(verdict);

      let COL_N = '#4e79a7', COL_D = '#f28e2b';
      const readPalette = () => {
        try {
          if (window.ColorPalettes) {
            const cat = window.ColorPalettes.getColors('categorical', 2);
            if (cat && cat.length >= 2) { COL_N = cat[0]; COL_D = cat[1]; }
          }
        } catch (_) {}
      };
      readPalette();

      const render = () => {
        const C = Math.pow(10, currentLogC);
        const { N_opt, D_opt, L_opt } = calcOpt(C);
        // 1 H100 GPU at ~400 TFLOP/s effective BF16 (40% MFU) = 4e14 FLOP/s => 1.44e18 FLOPs/hour
        const h100Hours = C / 1.44e18;
        const h100Str = h100Hours >= 1e6
          ? `${(h100Hours / 1e6).toFixed(2)}M giờ H100`
          : h100Hours >= 1e3
            ? `${(h100Hours / 1e3).toFixed(1)}K giờ H100`
            : `${Math.round(h100Hours)} giờ H100`;

        sliderLabel.textContent = `log₁₀(C) = ${currentLogC.toFixed(2)}`;
        cardC.v.textContent = fmtSci(currentLogC);
        cardC.s.textContent = `≈ ${h100Str}`;
        cardN.v.textContent = fmtNum(N_opt);
        cardN.v.style.color = COL_N;
        cardN.s.textContent = 'tham số mô hình';
        cardD.v.textContent = fmtNum(D_opt);
        cardD.v.style.color = COL_D;
        cardD.s.textContent = 'token huấn luyện (20×N)';
        cardL.v.textContent = L_opt.toFixed(3);
        cardL.s.textContent = `Perplexity ≈ ${Math.exp(L_opt).toFixed(1)}`;

        pathD.attr('d', lineD).attr('stroke', COL_D);
        pathN.attr('d', lineN).attr('stroke', COL_N);
        legDRect.attr('fill', COL_D);
        legNRect.attr('fill', COL_N);
        presetGroup.selectAll('.preset-n').attr('fill', COL_N).attr('opacity', 0.65);

        const cx = xScale(currentLogC);
        cursorLine.attr('x1', cx).attr('x2', cx).attr('stroke', 'var(--text-color)');
        dotD.attr('cx', cx).attr('cy', yScale(Math.log10(D_opt))).attr('fill', COL_D);
        dotN.attr('cx', cx).attr('cy', yScale(Math.log10(N_opt))).attr('fill', COL_N);

        if (activePreset && Math.abs(activePreset.logC - currentLogC) < 0.03) {
          const L_act = calcLoss(activePreset.N_act, activePreset.D_act);
          const diff = L_act - L_opt;
          verdict.innerHTML = `<strong>${activePreset.label}:</strong> ${activePreset.note} `
            + `(Loss thực tế ước tính: <strong>${L_act.toFixed(3)}</strong> vs Tối ưu Chinchilla: <strong>${L_opt.toFixed(3)}</strong>${diff > 0.005 ? `, lệch +${diff.toFixed(3)} nats` : ''}).`;
        } else {
          verdict.innerHTML = `Ở ngân sách <strong>${fmtSci(currentLogC)} FLOPs</strong>, cấu hình tối ưu tính toán theo định luật Chinchilla là mô hình <strong>${fmtNum(N_opt)} tham số</strong> được huấn luyện trên <strong>${fmtNum(D_opt)} token</strong>, đạt hàm mất mát dự kiến <strong>${L_opt.toFixed(3)} nats/token</strong>.`;
        }
      };

      slider.addEventListener('input', () => {
        currentLogC = parseFloat(slider.value);
        activePreset = null;
        presetBtns.forEach((b) => b.classList.remove('active'));
        render();
      });

      render();
      document.addEventListener('palettes:updated', () => { readPalette(); render(); });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => ensureD3(bootstrap), { once: true });
    } else {
      ensureD3(bootstrap);
    }
  })();
</script>
