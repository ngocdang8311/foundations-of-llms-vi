<div class="d3-banner"></div>
<style>
  .d3-banner { padding: 22px 24px; border: 1px solid var(--border-color); border-radius: 10px; background: color-mix(in oklab, var(--text-color) 5%, var(--page-bg)); text-align: center; color: var(--text-color); }
  .d3-banner .source { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-color); }
  .d3-banner .review { margin: 0; font-size: 22px; line-height: 1.45; text-wrap: balance; }
  .d3-banner .review-vi { margin: 8px 0 0; font-size: 15px; line-height: 1.45; font-style: italic; color: var(--muted-color); text-wrap: balance; }
  .d3-banner .verdict { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 24px; margin-top: 16px; font-size: 15px; color: var(--muted-color); }
  .d3-banner .model { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; }
  .d3-banner .model > span { white-space: nowrap; }
  .d3-banner .gauge { display: block; width: 120px; height: 8px; border-radius: 4px; overflow: hidden; }
  .d3-banner .gauge span { display: block; height: 100%; }
  .d3-banner .score { font-weight: 600; color: var(--text-color); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .d3-banner { padding: 18px 16px; }
    .d3-banner .review { font-size: 19px; }
  }
</style>
<script>
  (() => {
    // Illustration of the chapter, under its title: one of the hard reviews of section 3.4, and the
    // probability of being positive that a bag-of-words model gives it. The probability is read from
    // hard-reviews.json, written by the notebook of exercise 3.4 (the model of exercise 3.2); the
    // value below is only shown if the file cannot be read.
    const REVIEW = {
      text: 'Wow, what a masterpiece. Two hours of pure brilliance, and I only checked my watch twenty times. '
        + 'The acting was so convincing that I truly believed the actors wanted to be somewhere else. '
        + 'A perfect film if you love naps.',
      pPositive: 0.761,
      model: 'Bag of words, counts', // the label of the model in hard-reviews.json
    };
    const DATA_PATHS = ['/data/hard-reviews.json', './assets/data/hard-reviews.json', '../assets/data/hard-reviews.json'];

    const bootstrap = () => {
      const scriptEl = document.currentScript;
      let container = scriptEl ? scriptEl.previousElementSibling : null;
      if (container && container.tagName === 'STYLE') container = container.previousElementSibling;
      if (!(container && container.classList && container.classList.contains('d3-banner'))) {
        const candidates = Array.from(document.querySelectorAll('.d3-banner'))
          .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
        container = candidates[candidates.length - 1] || null;
      }
      if (!container) return;
      if (container.dataset.mounted === 'true') return;
      container.dataset.mounted = 'true';

      const source = document.createElement('p');
      source.className = 'source';
      source.textContent = 'Phân loại cảm xúc một bài đánh giá phim trên IMDB';

      const review = document.createElement('p');
      review.className = 'review';
      review.textContent = `“${REVIEW.text}”`;

      const reviewVi = document.createElement('p');
      reviewVi.className = 'review-vi';
      reviewVi.textContent = '“Chà, quả là một kiệt tác. Hai tiếng đồng hồ xuất sắc thuần túy, và tôi mới chỉ nhìn đồng hồ có hai mươi lần. Diễn xuất thuyết phục đến mức tôi thực sự tin rằng các diễn viên chỉ muốn ở một nơi nào khác. Một bộ phim hoàn hảo nếu bạn thích ngủ trưa.”';

      const verdict = document.createElement('div');
      verdict.className = 'verdict';
      const model = document.createElement('span');
      model.className = 'model';
      const name = document.createElement('span');
      name.textContent = 'Mô hình túi từ (Bag-of-words):';
      const gauge = document.createElement('span');
      gauge.className = 'gauge';
      gauge.setAttribute('aria-hidden', 'true');
      const fill = document.createElement('span');
      gauge.append(fill);
      const score = document.createElement('span');
      score.className = 'score';
      const showProbability = (p) => {
        fill.style.width = `${p * 100}%`;
        score.textContent = `${Math.round(p * 100)}% tích cực`;
      };
      showProbability(REVIEW.pPositive);
      model.append(name, gauge, score);
      verdict.append(model);
      container.append(source, review, reviewVi, verdict);

      (async () => {
        for (const path of DATA_PATHS) {
          try {
            const r = await fetch(path, { cache: 'no-cache' });
            if (!r.ok) continue;
            const data = await r.json();
            const i = data.reviews.findIndex((d) => d.text === REVIEW.text);
            const row = data.models.find((m) => m.label === REVIEW.model);
            if (i >= 0 && row) showProbability(row.p_positive[i]);
            return;
          } catch (_) {}
        }
      })();

      // Diverging palette: the primary color at one end (negative), its complement at the other (positive).
      const paint = () => {
        let neg = 'var(--primary-color)';
        let pos = 'var(--info-color)';
        try {
          const div = window.ColorPalettes && window.ColorPalettes.getColors('diverging', 3);
          if (div && div.length >= 3) { neg = div[0]; pos = div[div.length - 1]; }
        } catch (_) {}
        gauge.style.background = `color-mix(in oklab, ${neg} 70%, transparent)`;
        fill.style.background = pos;
      };
      paint();
      document.addEventListener('palettes:updated', paint);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap, { once: true });
    } else { bootstrap(); }
  })();
</script>
